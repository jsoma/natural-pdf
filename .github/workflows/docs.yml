name: Build and deploy docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs-site/**'
      - 'natural_pdf/**'
      - 'pdfs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/docs_build.py'
      - 'scripts/docs_stage.py'
      - 'scripts/generate_reference.py'
      - 'scripts/generate_api_reference.py'
      - 'tests/test_docs_site_output.py'
      - '.github/workflows/docs.yml'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install system dependencies (OpenCV/Paddle need libGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          uv sync --extra all --extra notebook --extra docs

      - name: Cache HF models (nightly-tier pages)
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-nightly-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-nightly-

      # docs-executed/ holds ONLY the pipeline's outputs (executed md, assets,
      # notebooks, thumbnails), kept separate from the authored tree so the
      # cache and authored-source updates never fight. Same HF key as the
      # nightly so model weights are shared.
      - name: Cache executed docs
        uses: actions/cache@v5.0.5
        with:
          path: |
            .docs-build-cache.json
            docs-executed
          key: docs-executed-deploy-v2-${{ hashFiles('docs/**/*.md', 'natural_pdf/**/*.py', 'scripts/docs_build.py', 'pyproject.toml', 'uv.lock', 'pdfs/**/*.pdf') }}
          restore-keys: |
            docs-executed-deploy-v2-

      # Execute ALL tiers for deploy: the deployed site is the product, and
      # the content-hash cache makes reruns incremental. A broken page fails
      # the deploy (--keep-going surfaces every failure first).
      - name: Execute docs pages
        run: |
          failed=0
          for section in get-started learn concepts solve troubleshooting for-agents; do
            if [ -d "docs/$section" ]; then
              uv run python scripts/docs_build.py "docs/$section" \
                --out "docs-executed/$section" \
                --colab-ref gh-pages --colab-prefix "$section" \
                --keep-going || failed=1
            else
              rm -rf "docs-executed/$section"
            fi
          done
          exit "$failed"

      - name: Check generated reference pages are current
        run: uv run python scripts/generate_reference.py --check

      # griffe comes from the docs extra; without --extra docs the import fails.
      - name: Generate API reference fragments
        run: uv run --extra docs python scripts/generate_api_reference.py

      # Overlays executed output on authored pages and populates
      # docs-site/src/content/docs and docs-site/public (notebooks included,
      # so they land in dist/ at their gh-pages paths).
      - name: Stage docs into Starlight site tree
        run: uv run --extra docs python scripts/docs_stage.py

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Verify built site
        run: uv run --extra test pytest tests/test_docs_site_output.py

      # gh-pages history is the artifact store. Rollback to a previous deploy:
      #   git push origin <last-good-sha>:gh-pages --force
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs-site/dist
          branch: gh-pages
