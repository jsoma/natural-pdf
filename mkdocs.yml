site_name: Natural PDF
site_description: A more intuitive interface for working with PDFs
site_url: https://jsoma.github.io/natural-pdf/
repo_url: https://github.com/jsoma/natural-pdf
repo_name: jsoma/natural-pdf
copyright: "&copy; 2023-2025 Jonathan Soma"

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  font:
    text: Roboto
    code: SFMono-Regular
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow
  language: en

extra_css:
  - assets/stylesheets/custom.css

# docs_dir is overridable so CI can point mkdocs at the staging tree that
# contains executed pages (see .github/workflows/docs.yml). Local builds
# default to the authored sources in docs/.
docs_dir: !ENV [NPDF_DOCS_DIR, docs]

nav:
  - Home: index.md
  - Get Started:
    - get-started/index.md
    - Quickstart: get-started/quickstart.md
    - Coming from pdfplumber: get-started/from-pdfplumber.md
  - Learn:
    - learn/index.md
    - 1. Text and tables: learn/01-text-and-tables.md
    - 2. OCR: learn/02-ocr.md
    - 3. AI extraction: learn/03-ai-extraction.md
    - 4. Page structure: learn/04-page-structure.md
    - 5. Putting it together: learn/05-putting-it-together.md
  - Concepts:
    - concepts/index.md
    - The spatial model: concepts/spatial-model.md
    - How text becomes elements: concepts/text-and-elements.md
    - Exclusions: concepts/exclusions.md
    - Selectors: concepts/selectors.md
    - Tables, a decision guide: concepts/tables.md
    - Engines and models: concepts/engines-and-models.md
  - Solve:
    - solve/index.md
    - Multi-column reflow: solve/multi-column-reflow.md
    - Zebra-stripe table: solve/zebra-stripe-table.md
    - Arabic election table: solve/arabic-election-table.md
    - Use-of-force logs: solve/use-of-force-logs.md
    - Pixelated scan table: solve/pixelated-scan-table.md
    - Serbian multi-page table: solve/serbian-multipage-table.md
    - Borderless call log: solve/borderless-call-log.md
    - Complaint database printout: solve/complaint-database-printout.md
  - Troubleshooting: troubleshooting/index.md
  - Reference:
    - Selectors: reference/selectors.md
    - Engines: reference/engines.md
    - Installation extras: reference/installation-extras.md
    - Exceptions: reference/exceptions.md
    - OCR options: reference/ocr-options.md
    - API: api/index.md
    - Text Extraction: api/text-extraction.md
  - For Agents: for-agents/index.md

markdown_extensions:
  - pymdownx.highlight:
      pygments_style: solarized-light
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  # The docs pipeline authors tabs as /// tab | blocks (pymdownx.blocks.tab).
  - pymdownx.blocks.tab:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

plugins:
  - search
  - redirects:
      redirect_maps:
        # Retired getting-started section -> new six-section site
        'installation/index.md': 'get-started/index.md'
        'getting-started/index.md': 'get-started/index.md'
        'getting-started/quickstart.md': 'get-started/quickstart.md'
        'getting-started/selectors.md': 'concepts/selectors.md'
        'getting-started/concepts.md': 'concepts/index.md'
        'getting-started/choose-your-path.md': 'learn/index.md'
        # Retired tutorials -> Learn / Concepts
        'tutorials/01-loading-and-extraction.md': 'learn/01-text-and-tables.md'
        'tutorials/02-finding-elements.md': 'learn/01-text-and-tables.md'
        'tutorials/03-extracting-blocks.md': 'concepts/spatial-model.md'
        'tutorials/04-table-extraction.md': 'concepts/tables.md'
        'tutorials/05-excluding-content.md': 'concepts/exclusions.md'
        'tutorials/06-document-qa.md': 'learn/03-ai-extraction.md'
        'tutorials/07-layout-analysis.md': 'learn/04-page-structure.md'
        'tutorials/07-working-with-regions.md': 'learn/04-page-structure.md'
        'tutorials/08-spatial-navigation.md': 'concepts/spatial-model.md'
        'tutorials/09-section-extraction.md': 'learn/04-page-structure.md'
        'tutorials/10-form-field-extraction.md': 'learn/03-ai-extraction.md'
        'tutorials/11-enhanced-table-processing.md': 'concepts/tables.md'
        'tutorials/12-ocr-integration.md': 'learn/02-ocr.md'
        'tutorials/13-semantic-search.md': 'learn/03-ai-extraction.md'
        'tutorials/14-categorizing-documents.md': 'learn/03-ai-extraction.md'
        'tutorials/15-working-with-regions.md': 'learn/04-page-structure.md'
        # Retired cookbook -> Learn / Concepts / Solve / Troubleshooting
        'cookbook/index.md': 'learn/05-putting-it-together.md'
        'cookbook/batch-processing.md': 'learn/05-putting-it-together.md'
        'cookbook/one-page-one-row.md': 'learn/05-putting-it-together.md'
        'cookbook/finding-sections.md': 'learn/05-putting-it-together.md'
        'cookbook/structured-extraction.md': 'learn/03-ai-extraction.md'
        'cookbook/label-value-extraction.md': 'learn/01-text-and-tables.md'
        'cookbook/guides.md': 'concepts/tables.md'
        'cookbook/messy-tables.md': 'concepts/tables.md'
        'cookbook/form-cells.md': 'concepts/tables.md'
        'cookbook/multi-column-layouts.md': 'solve/multi-column-reflow.md'
        'cookbook/ocr-then-navigate.md': 'learn/02-ocr.md'
        'cookbook/multipage-content.md': 'learn/04-page-structure.md'
        'cookbook/troubleshooting.md': 'troubleshooting/index.md'
        # Retired standalone sections
        'use-cases/idea-gallery.md': 'solve/index.md'
        'quick-reference/index.md': 'reference/selectors.md'
        'for-llms/common-patterns.md': 'for-agents/index.md'
        'for-llms/anti-patterns.md': 'for-agents/index.md'
        # Pre-rewrite how-to guide URLs -> new equivalents
        'text-extraction/index.md': 'learn/01-text-and-tables.md'
        'ocr/index.md': 'learn/02-ocr.md'
        'extracting-clean-text/index.md': 'concepts/exclusions.md'
        'fix-messy-tables/index.md': 'concepts/tables.md'
        'tables/index.md': 'concepts/tables.md'
        'process-forms-and-invoices/index.md': 'concepts/spatial-model.md'
        'data-extraction/index.md': 'learn/03-ai-extraction.md'
        'document-qa/index.md': 'learn/03-ai-extraction.md'
        'categorizing-documents/index.md': 'learn/03-ai-extraction.md'
        'element-selection/index.md': 'concepts/selectors.md'
        'pdf-navigation/index.md': 'learn/01-text-and-tables.md'
        'layout-analysis/index.md': 'learn/04-page-structure.md'
        'regions/index.md': 'learn/04-page-structure.md'
        'visual-debugging/index.md': 'learn/01-text-and-tables.md'
        'interactive-widget/index.md': 'learn/01-text-and-tables.md'
        'describe/index.md': 'learn/01-text-and-tables.md'
        'loops-and-groups/index.md': 'learn/05-putting-it-together.md'
        'text-analysis/index.md': 'concepts/selectors.md'
        'reflowing-pages/index.md': 'solve/multi-column-reflow.md'
        'finetuning/index.md': 'learn/02-ocr.md'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            inherited_members: true
            show_category_heading: true
            show_root_heading: true
            show_object_full_path: true
            heading_level: 3
            docstring_style: google
            docstring_options:
              replace_admonitions: true
watch:
  - natural_pdf/
  - docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jsoma/natural-pdf
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/natural-pdf/
